name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: JavaScript tests
        run: node --test --test-concurrency=1 tests/test_js_batches.mjs tests/test_js_validate.mjs tests/test_js_gemini.mjs tests/test_js_run_control.mjs tests/test_js_docx.mjs tests/test_js_prompt.mjs tests/test_js_blank_pages.mjs tests/test_js_issues.mjs tests/test_js_i18n.mjs
